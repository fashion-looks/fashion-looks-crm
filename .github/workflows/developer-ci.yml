name: Developer CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * 1-5"

permissions:
  contents: read

concurrency:
  group: developer-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-check:
    name: Repository and developer checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check whitespace and merge markers
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if grep -RInE '^(<<<<<<< |=======|>>>>>>> )' . --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=.venv; then
            echo "Merge-conflict markers found."
            exit 1
          fi

      - name: Validate JSON files
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            python -m json.tool "$file" >/dev/null
          done < <(find . -type f -name '*.json' -not -path './.git/*' -not -path '*/node_modules/*' -print0)

      - name: Validate HTML files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class Validator(HTMLParser):
              pass

          files = [p for p in Path('.').rglob('*.html') if '.git' not in p.parts and 'node_modules' not in p.parts]
          for path in files:
              parser = Validator()
              parser.feed(path.read_text(encoding='utf-8'))
              parser.close()
              print(f'HTML parsed: {path}')
          print(f'Validated {len(files)} HTML file(s).')
          PY

      - name: Set up Python for automation scripts
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile Python automation files
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find . -type f -name '*.py' -not -path './.git/*' -not -path '*/.venv/*' -not -path '*/node_modules/*' -print0)
          if ((${#files[@]} > 0)); then
            python -m compileall -q "${files[@]}"
          else
            echo "No Python files found; skipping compilation."
          fi

      - name: Detect Node project and run available checks
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f package.json ]]; then
            node --version
            npm --version
            npm ci
            if node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)"; then
              npm test
            else
              echo "No test script defined; dependency install completed."
            fi
            if node -e "process.exit(require('./package.json').scripts?.build ? 0 : 1)"; then
              npm run build
            else
              echo "No build script defined; skipping build."
            fi
          else
            echo "No package.json at repository root; skipping Node checks."
          fi

      - name: Report CI result
        if: always()
        run: echo "Developer CI finished with status ${{ job.status }}."
